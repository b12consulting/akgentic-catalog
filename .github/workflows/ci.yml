name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  NO_COLOR: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout akgentic-catalog
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      # akgentic-* siblings resolve from PyPI under the floors in pyproject.toml.
      # All extras are listed so mypy can analyze their imports.
      - name: Install dependencies
        run: uv pip install -e ".[dev,api,cli,mongo,postgres]"

      # --no-sync: run in the venv built above without re-resolving from a
      # lockfile (there is no project lockfile in this install model).
      - name: Type checking
        run: uv run --no-sync mypy src/

      - name: Linting
        run: uv run --no-sync ruff check src/

      - name: Run tests with coverage
        env:
          DB_CONN_STRING_PERSISTENCE: postgresql://postgres:postgres@localhost:5432/catalog_test
        run: >
          uv run --no-sync pytest tests/
          --cov=akgentic.catalog
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=80

      - name: Update coverage badge
        if: github.ref_name == 'master' && github.event_name == 'push'
        run: |
          COVERAGE=$(python -c "import json; print(int(json.load(open('coverage.json'))['totals']['percent_covered_display']))")
          if [ "$COVERAGE" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$COVERAGE" -ge 80 ]; then COLOR="green"
          elif [ "$COVERAGE" -ge 70 ]; then COLOR="yellow"
          else COLOR="red"; fi
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}" > badge.json
          gh gist edit 35850b0665f1d1dd2402c43362ee4d35 -f coverage.json badge.json
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
